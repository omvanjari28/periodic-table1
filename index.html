<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="google-site-verification" content="VaVL8l57Elpn_f00ZhNC4G7DaO0k7gw-Ukm1BUnj1oY" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Interactive Periodic Table of Elements featuring 118 real chemical elements with detailed properties, search, and categorization.">
  <title>Interactive Periodic Table</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app-background"></div>
  <header>
    <h1>The Periodic Table</h1>
    <div class="search-container">
      <input type="text" id="search-input" placeholder="Search elements by name or symbol..." autocomplete="off">
    </div>
    <div class="voice-controls">
      <button id="mute-btn" class="ctrl-btn" title="Mute/Unmute">🔊</button>
      <button id="stop-btn" class="ctrl-btn" title="Stop Speaking">⏹</button>
      <select id="voice-select" title="Voice Language"></select>
      <div class="slider-group">
        <label for="rate-slider">Rate:</label>
        <input type="range" id="rate-slider" min="0.5" max="2" value="1" step="0.1">
      </div>
      <div class="slider-group">
        <label for="pitch-slider">Pitch:</label>
        <input type="range" id="pitch-slider" min="0" max="2" value="1" step="0.1">
      </div>
    </div>
  </header>

  <main>
    <div class="table-legend">
      <div class="legend-item"><span class="color-box alkali-metal"></span> Alkali Metal</div>
      <div class="legend-item"><span class="color-box alkaline-earth"></span> Alkaline Earth</div>
      <div class="legend-item"><span class="color-box transition-metal"></span> Transition Metal</div>
      <div class="legend-item"><span class="color-box post-transition"></span> Post Transition</div>
      <div class="legend-item"><span class="color-box metalloid"></span> Metalloid</div>
      <div class="legend-item"><span class="color-box reactive-nonmetal"></span> Reactive Nonmetal</div>
      <div class="legend-item"><span class="color-box noble-gas"></span> Noble Gas</div>
      <div class="legend-item"><span class="color-box lanthanide"></span> Lanthanide</div>
      <div class="legend-item"><span class="color-box actinide"></span> Actinide</div>
    </div>

    <div class="periodic-table" id="periodic-table">
      <!-- Element tiles will be generated dynamically by JavaScript -->
    </div>

  </main>

  <!-- Modal Overlay -->
  <div id="element-modal" class="modal hidden">
    <div class="modal-content" id="modal-content">
      <span class="close-btn" id="close-btn">&times;</span>
      <div id="modal-details">
        <!-- Details populated dynamically -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
